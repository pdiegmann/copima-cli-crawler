name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

jobs:
  # Run tests once on Linux
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage:ci
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage/lcov.info') != ''
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-release
          fail_ci_if_error: false
        continue-on-error: true

  # Build binaries on native platforms
  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            name: macos-arm64
            extension: ""
          - os: macos-13 # Intel Mac
            target: bun-darwin-x64
            name: macos-x64
            extension: ""
          - os: ubuntu-latest
            target: bun-windows-x64
            name: windows
            extension: ".exe"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build executable
        run: |
          mkdir -p dist
          bun build --compile --target=${{ matrix.target }} --outfile=dist/copima-cli-${{ matrix.name }}${{ matrix.extension }} ./src/bin/cli.ts

      - name: Sign macOS binary (ad-hoc)
        if: runner.os == 'macOS'
        run: |
          codesign -s - --force --deep dist/copima-cli-${{ matrix.name }}
          codesign -dv dist/copima-cli-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: copima-cli-${{ matrix.name }}
          path: dist/copima-cli-${{ matrix.name }}${{ matrix.extension }}
          retention-days: 1

  # Create release and upload all artifacts
  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Organize artifacts
        run: |
          # Move artifacts from subdirectories to dist root
          find dist -type f -name "copima-cli-*" -exec mv {} dist/ \;
          # Remove empty artifact directories
          find dist -type d -empty -delete
          ls -la dist/

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          RELEASE_DATE=$(date +%Y-%m-%d)
          bun run scripts/update-changelog.ts "$VERSION" "$RELEASE_DATE"

          if git diff --quiet CHANGELOG.md; then
            echo "ℹ️  No changes to CHANGELOG.md"
          else
            echo "✅ CHANGELOG.md updated"
          fi

      - name: Commit and push CHANGELOG.md
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if ! git diff --quiet CHANGELOG.md; then
            git fetch origin main:main
            git checkout main
            git add CHANGELOG.md
            git commit -m "docs: update CHANGELOG.md for version ${{ steps.version.outputs.VERSION }}"
            git push origin main
            echo "✅ CHANGELOG.md committed and pushed to main"
          else
            echo "ℹ️  No changes to commit"
          fi

      - name: Create checksums
        run: |
          cd dist
          sha256sum copima-cli-* > checksums.txt
          cat checksums.txt

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          files: |
            dist/copima-cli-*
            dist/checksums.txt
          body: |
            ## What's Changed

            Release ${{ steps.version.outputs.VERSION }} of Copima CLI Crawler

            ### Downloads

            | Platform | Architecture | Download |
            |----------|--------------|----------|
            | Windows | x64 | [copima-cli-windows.exe](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/copima-cli-windows.exe) |
            | macOS | Intel (x64) | [copima-cli-macos-x64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/copima-cli-macos-x64) |
            | macOS | Apple Silicon (ARM64) | [copima-cli-macos-arm64](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/copima-cli-macos-arm64) |

            ### Installation

            #### Windows
            ```bash
            # Download and run
            curl -L -o copima-cli.exe https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/copima-cli-windows.exe
            ./copima-cli.exe --help
            ```

            #### macOS
            ```bash
            # Intel Macs
            curl -L -o copima-cli https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/copima-cli-macos-x64
            chmod +x copima-cli
            ./copima-cli --help

            # Apple Silicon Macs
            curl -L -o copima-cli https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/copima-cli-macos-arm64
            chmod +x copima-cli
            ./copima-cli --help
            ```

            ### Verification

            You can verify the integrity of the downloads using the checksums provided in the `checksums.txt` file.
